<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rekindle — a schedule slot re-planned from a rating: Maya rated the teashop 8. The distillery stays struck through. Week two leans toward what she actually enjoyed.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-8%    steady state: the full static mark — plate, ruled rows, printed line + ember underline, the pencilled entry (outline) struck through, and the P tab rimmed in ember with the 8, overhanging the plate's bottom-right corner (poster rule: all brand visible at t=0)
  8-24%   trigger:      a week not yet rated: the P tab empties to a printed ink box and the underline greys back to pencil graphite   data-story="beat-2"
  24-50%  mechanism:    Maya rated the teashop 8. The distillery stays struck through. Week two leans toward what she actually enjoyed.   data-story="beat-3"
                        (the 8 is written into the P tab and its rim turns ember; the ember then catches along the underline left→right with a spark at its head; a pencil pass re-traces the strike, which stays)
  50-85%  resolution:   an ember thread carries the rating out of the P tab into the empty bottom row, where next week's entry inks in and holds; the warmth breathes   data-story="beat-4"
  85-100% breathe + seam fade: thread and entry fade 88-94%, story group fades 96-100% (in 0-2%), poster returns with no cut
-->
<style>
  .breath { transform-box: fill-box; transform-origin: center; animation: breath 6s ease-in-out infinite; }
  @keyframes breath { 0%, 50% { transform: scale(1); } 66% { transform: scale(1.035); } 80%, 100% { transform: scale(1); } }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop6 6s linear infinite; }
  @keyframes pop6 { 0%, 24% { transform: scale(.35); } 26% { transform: scale(1.18); } 27.5%, 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="ia-kindle" x1="78" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A968E"/>
      <stop offset=".15" stop-color="#C4501A"/>
      <stop offset="1" stop-color="#C4501A"/>
    </linearGradient>
    <mask id="ia-rimgap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="#fff"/><rect x="432" y="355" width="28.5" height="9.5" fill="#000"/><rect x="355" y="432" width="9.5" height="28.5" fill="#000"/></mask>
    <filter id="ia-warm" x="-12%" y="-70%" width="124%" height="240%"><feGaussianBlur stdDeviation="8.5"/></filter>
  <filter id="ia-spark" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  <mask id="ia-catch" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <path d="M89.5 192.3 C 182.1 190.9, 302.5 190.9, 361.8 189.5 C 378.5 188.6, 391.5 185.8, 400.7 183.5" pathLength="100" fill="none" stroke="#fff" stroke-width="80" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" keyTimes="0;0.27;0.42;1" values="100;100;0;0"/></path>
  </mask>
</defs>

<!-- brand layer: the static mark, fully visible at t=0 -->
<g id="brand">
  <rect x="22" y="22" width="424" height="424" rx="78" fill="#FBF8F1" stroke="#26221D" stroke-width="28" mask="url(#ia-rimgap)"/><g stroke="#DCD2BF" stroke-width="4"><line x1="58" y1="219" x2="410" y2="219"/><line x1="58" y1="345" x2="410" y2="345"/></g><rect x="95" y="126.5" width="209.5" height="41" rx="11" fill="#26221D"/><rect x="319" y="126.5" width="54" height="41" rx="11" fill="#26221D"/><path class="breath" d="M87.7 180.3 C 172.9 178, 284 178, 356.3 177.9 C 371.1 177.8, 384 177.3, 394.2 176.8 C 401.6 176.4, 406.3 178.9, 405.9 182.6 C 405.5 186.8, 401.2 189.4, 395.2 190 C 378.5 192.3, 365.5 200.2, 339.6 202 C 274.8 206.7, 172.9 204.4, 93.2 203.4 C 74.7 203, 71 181.2, 87.7 180.3 Z" fill="#C4501A" opacity=".38" filter="url(#ia-warm)" transform="translate(0 5.5)"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.125;0.42;0.48;0.66;0.8;1" values="0.38;0.38;0.02;0.02;0.38;0.62;0.38;0.38"/></path><path d="M87.7 180.3 C 172.9 178, 284 178, 356.3 177.9 C 371.1 177.8, 384 177.3, 394.2 176.8 C 401.6 176.4, 406.3 178.9, 405.9 182.6 C 405.5 186.8, 401.2 189.4, 395.2 190 C 378.5 192.3, 365.5 200.2, 339.6 202 C 274.8 206.7, 172.9 204.4, 93.2 203.4 C 74.7 203, 71 181.2, 87.7 180.3 Z" fill="url(#ia-kindle)"/><rect x="100" y="265" width="138" height="31" rx="6" fill="none" stroke="#8C8880" stroke-width="10"/><rect x="263" y="265" width="105" height="31" rx="6" fill="none" stroke="#8C8880" stroke-width="10"/><path d="M66.4 293.4 L397.1 243.7 C 411.3 241.3, 415 263.2, 400.7 265.6 L71.8 326.2 C 52.1 329.5, 46.6 296.7, 66.4 293.4 Z" fill="#8C8880"/><rect x="371" y="371" width="126" height="126" rx="12" fill="#FBF8F1" stroke="#C4501A" stroke-width="14"/><path d="M434 477.3L434 477.3Q426.4 477.3 420.6 475.5Q414.7 473.6 410.6 470.4Q406.5 467.1 404.4 462.6Q402.3 458.1 402.3 452.9L402.3 452.9Q402.3 444.7 407 439.7Q411.7 434.7 419 432.7L419 432.7L419 431.7Q412.8 429.5 408.8 424.8Q404.8 420.1 404.8 412.8L404.8 412.8Q404.8 408.0 406.8 403.9Q408.7 399.8