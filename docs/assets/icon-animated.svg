  <!-- beat 2: the P tab empties to a printed ink box (paper + a 10 px ink rim over the ember rim and its 8) … -->
  <g data-story="beat-2" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.125;0.3;0.31;1" values="0;0;1;1;0;0"/>
    <rect x="369" y="369" width="130" height="130" rx="12" fill="#FBF8F1" stroke="#26221D" stroke-width="10"/>
    <!-- … beat 3: then the 8 is written into it and its rim turns ember (hands back to the identical brand tab at 30%) -->
    <g data-story="beat-3" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.235;0.24;0.88;0.94;1" values="0;0;1;1;0;0"/><rect x="371" y="371" width="126" height="126" rx="12" fill="#FBF8F1" stroke="#C4501A" stroke-width="14"/><path d="M434 477.3L434 477.3Q426.4 477.3 420.6 475.5Q414.7 473.6 410.6 470.4Q406.5 467.1 404.4 462.6Q402.3 458.1 402.3 452.9L402.3 452.9Q402.3 444.7 407 439.7Q411.7 434.7 419 432.7L419 432.7L419 431.7Q412.8 429.5 408.8 424.8Q404.8 420.1 404.8 412.8L404.8 412.8Q404.8 408.0 406.8 403.9Q408.7 399.8 412.4 396.9Q416.1 393.9 421.5 392.3Q426.9 390.7 434 390.7L434 390.7Q441.0 390.7 446.4 392.3Q451.9 393.9 455.6 396.9Q459.3 399.8 461.2 403.9Q463.2 408.0 463.2 412.8L463.2 412.8Q463.2 420.1 459.2 424.8Q455.2 429.5 449 431.7L449 431.7L449 432.7Q456.3 434.7 461 439.7Q465.7 444.7 465.7 452.9L465.7 452.9Q465.7 458.1 463.6 462.6Q461.5 467.1 457.4 470.4Q453.3 473.6 447.4 475.5Q441.6 477.3 434 477.3ZM434 463.5L434 463.5Q440.2 463.5 443.5 460.7Q446.8 457.8 446.8 452.9L446.8 452.9L446.8 450.5Q446.8 445.4 443.6 442.6Q440.4 439.8 434 439.8L434 439.8Q427.6 439.8 424.4 442.6Q421.2 445.4 421.2 450.5L421.2 450.5L421.2 452.9Q421.2 457.8 424.5 460.7Q427.8 463.5 434 463.5ZM434 426.6L434 426.6Q440 426.6 443.1 423.8Q446.2 421.1 446.2 416.4L446.2 416.4L446.2 414.6Q446.2 409.9 443.1 407.2Q439.9 404.5 434 404.5L434 404.5Q428.1 404.5 424.9 407.2Q421.8 409.9 421.8 414.6L421.8 414.6L421.8 416.4Q421.8 421.1 424.9 423.8Q428 426.6 434 426.6Z" fill="#C4501A" class="pop"/></g>
